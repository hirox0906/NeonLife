    </filter>
  </defs>
  <rect width="64" height="64" rx="10" fill="#03040c" />
  <g fill="#4dfcff" filter="url(#glow)">
    <rect x="13" y="13" width="14" height="14" />
    <rect x="37" y="13" width="14" height="14" fill="#ff3bd4" />
    <rect x="13" y="37" width="14" height="14" fill="#ffe66d" />
    <rect x="37" y="37" width="14" height="14" />
  </g>
</svg>
